name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apps-script:
    name: Apps Script tests (Node, no Google)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('apps-script/appsscript.json','utf8'))"
      - name: Run tests
        run: node --test "apps-script/test/*.test.js"
